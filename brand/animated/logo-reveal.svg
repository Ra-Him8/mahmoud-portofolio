<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>Mahmoud Mohamed - animated mark</title>
  <desc>Self-animating logo. Loops every 4 seconds. No JavaScript needed.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14E0C8"/>
      <stop offset="55%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FF6A2B"/>
    </linearGradient>
  </defs>

  <!-- the M draws itself on -->
  <path d="M14 45V19l9 13 9-13v26" fill="none" stroke="url(#g)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="84" stroke-dashoffset="84">
    <animate attributeName="stroke-dashoffset" values="84;0;0;84"
             keyTimes="0;0.25;0.9;1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- the play triangle snaps in -->
  <path d="M38 45V19l12 13-12 13z" fill="url(#g)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0"
             keyTimes="0;0.2;0.34;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale"
             values="0.4;0.4;1.08;1;1;0.4" keyTimes="0;0.2;0.3;0.36;0.9;1"
             dur="4s" repeatCount="indefinite" additive="sum"/>
  </path>

  <!-- the before/after divider wipes down -->
  <line x1="35" y1="6" x2="35" y2="58" stroke="#F2F3F7" stroke-width="1.5" opacity=".55"
        stroke-dasharray="52" stroke-dashoffset="52">
    <animate attributeName="stroke-dashoffset" values="52;52;0;0;52"
             keyTimes="0;0.28;0.45;0.9;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- the grab handle pops -->
  <circle cx="35" cy="32" r="3.2" fill="#F2F3F7" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0"
             keyTimes="0;0.42;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0;0;4.2;3.2;3.2;0"
             keyTimes="0;0.42;0.48;0.54;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
