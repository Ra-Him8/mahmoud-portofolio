# Netlify configuration. If you deploy somewhere else, this file is ignored
# and nothing breaks — it just stops applying the caching and headers below.

[build]
  publish = "."

# ------------------------------------------------------------------ headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Keep the control panel out of Google even if someone links to it.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long cache for things whose names rarely change.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CSS/JS change when you edit the site, so cache them briefly and revalidate.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# data.js is the file you replace most often — never let it go stale.
[[headers]]
  for = "/assets/js/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
