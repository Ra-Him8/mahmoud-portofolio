<!-- ------------------------------------------------------------------
     PASSCODE LOCK
     Default code: mahmoud2026

     To change it: open the browser console on this page, run
        fnv('your-new-code')
     and paste the number into CODE_HASH below.

     Locked out? Set CODE_HASH to 0 and the lock switches off.

     Be clear about what this is: a lock on a door that is not on the
     street. This panel is NOT published with your website (see
     _config.yml), and even if someone did open it, their edits only
     change what THEY see in THEIR browser. Your live site reads
     assets/js/data.js from your GitHub repo - only your GitHub account
     can change that.
     ------------------------------------------------------------------ -->
<div class="lock" id="lock">
  <form class="lock__box" id="lockForm">
    <svg class="lock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
    </svg>
    <h1>Control Panel</h1>
    <p>This is your private editor. Enter your passcode.<br><span dir="rtl">دي لوحة التحكم بتاعتك. اكتب الكود.</span></p>
    <input type="password" id="lockInput" placeholder="Passcode" autocomplete="current-password" autofocus>
    <button type="submit" class="btn btn--go">Unlock</button>
    <span class="lock__err" id="lockErr" hidden>Wrong passcode. Try again.</span>
  </form>
</div>

<script>
(function () {
  var CODE_HASH = 1171765698;          /* mahmoud2026 - change me */
  var KEY = 'mm_admin_ok';

  /* FNV-1a. Not cryptography - it works on file:// where crypto.subtle
     does not, and the real protection is that this page is never published. */
  window.fnv = function (str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };

  function boot() {
    var lock = document.getElementById('lock');
    if (lock) lock.remove();
    ['assets/js/data.js', 'assets/js/admin.js'].reduce(function (chain, src) {
      return chain.then(function () {
        return new Promise(function (done, fail) {
          var t = document.createElement('script');
          t.src = src; t.onload = done; t.onerror = fail;
          document.body.appendChild(t);
        });
      });
    }, Promise.resolve());
  }

  var unlocked = false;
  try { unlocked = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
  if (!CODE_HASH || unlocked) { boot(); return; }

  document.getElementById('lockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('lockInput');
    if (fnv(input.value) === CODE_HASH) {
      try { sessionStorage.setItem(KEY, '1'); } catch (e2) {}
      boot();
    } else {
      document.getElementById('lockErr').hidden = false;
      input.value = '';
      input.focus();
    }
  });
})();
</script>
</body>
</html>
