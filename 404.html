<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Mahmoud Mohamed</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/img/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .oops{ min-height:100svh; display:grid; place-content:center; justify-items:center;
         text-align:center; gap:1.5rem; padding:2rem; position:relative; z-index:2; }
  .oops__code{ font-family:"Sora",sans-serif; font-weight:800; line-height:1;
               font-size:clamp(5rem,22vw,13rem); letter-spacing:-.06em;
               background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .oops__title{ font-size:clamp(1.5rem,4vw,2.25rem); }
  .oops__sub{ color:var(--muted); max-width:44ch; }
</style>
</head>
<body dir="ltr">

<div class="bg-fx" aria-hidden="true">
  <span class="blob blob--1"></span>
  <span class="blob blob--2"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<main class="oops">
  <span class="logo__mark" style="width:64px;height:64px;border-radius:18px">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#14E0C8"/><stop offset="55%" stop-color="#FFB020"/><stop offset="100%" stop-color="#FF6A2B"/>
      </linearGradient></defs>
      <path d="M14 45V19l9 13 9-13v26" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 45V19l12 13-12 13z" fill="url(#g)"/>
      <line x1="35" y1="6" x2="35" y2="58" stroke="#F2F3F7" stroke-width="1.5" opacity=".55"/>
      <circle cx="35" cy="32" r="3.2" fill="#F2F3F7"/>
    </svg>
  </span>

  <span class="oops__code">404</span>
  <h1 class="oops__title">This clip got cut</h1>
  <p class="oops__sub">That page doesn't exist. It happens — let's get you back to the work.</p>

  <div style="display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center">
    <a class="btn btn--primary btn--lg" id="homeLink" href="/">Back to the portfolio</a>
    <a class="btn btn--wa btn--lg" href="https://wa.me/201280407731" target="_blank" rel="noopener noreferrer">
      Message me on WhatsApp
    </a>
  </div>
</main>

<script>
/* On GitHub Pages this site lives under /repo-name/; on a custom domain it
   lives at /. Work out which from the current URL so the button below is
   right either way instead of dumping people on the wrong root. */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var onPages = /\.github\.io$/i.test(location.hostname);
  document.getElementById('homeLink').href =
    (onPages && parts.length) ? '/' + parts[0] + '/' : '/';
})();
</script>

</body>
</html>
